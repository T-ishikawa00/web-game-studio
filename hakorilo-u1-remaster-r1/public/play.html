<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#eaf3f0"><title>Hakorilo — Parcel Grove</title><link rel="icon" href="data:,"><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="full.css"><script type="module" src="game.js"></script></head>
<body data-screen="title"><main id="game"><div id="loading" role="status"><b>Hakorilo</b><span>小さな村を準備しています / Opening the grove…</span></div><div id="sky"><i></i><i></i><i></i></div><div id="world"></div><p id="unsupported" role="alert" hidden></p>
<div class="brand-bar"><a href="/" class="wordmark" aria-label="Tinlumo Review">tinlumo<span>✦</span></a><div class="brand-actions"><span class="sub-brand">A LITTLE WORLD OF GOOD DAYS</span><button id="language" class="quiet">EN</button></div></div>
<section id="title" class="title-content"><p class="eyebrow">TINLUMO ORIGINAL</p><h1>Hakorilo<span>Parcel Grove</span></h1><p class="title-tag" data-ja="小さな荷物。やさしいひと呼吸。" data-en="Little parcels. A little patience."></p><p class="title-copy" data-ja="道をつないで、タイミングを合わせて。&#10;木漏れ日の村へ、ふたつの荷物を届けよう。" data-en="Find the route. Make a little room.&#10;Bring two parcels home through the sunlit grove."></p><div class="title-buttons"><button id="start" class="primary" data-ja="配達をはじめる →" data-en="Find a delivery →"></button><button id="continue" class="glass" data-ja="つづきから" data-en="Continue" hidden></button></div><div class="title-save"><span id="title-progress"></span><span id="title-save"></span><button id="title-settings" class="quiet" data-ja="設定" data-en="Settings"></button></div><p class="title-note" data-ja="急がなくて大丈夫。道は、きっとつながる。" data-en="Take your time. There’s a lovely way through."></p></section>
<section id="levels" class="level-panel" hidden><div class="journey-heading"><button id="back-title" class="quiet" data-ja="← タイトル" data-en="← Title"></button><p class="eyebrow">A LITTLE DELIVERY JOURNEY</p><h2 data-ja="今日の配達は？" data-en="Where to today?"></h2><div class="journey-summary"><p id="progress-count"></p><button id="journey-resume" class="glass"></button><button id="journey-next" class="primary" data-ja="次のおすすめへ →" data-en="Up next →"></button></div><div id="journey-progress" role="presentation"></div><p class="journey-note" data-ja="どの配達からでも選べます。自分のペースで、村を巡ろう。" data-en="Every delivery is open. Explore the grove at your own pace."></p></div><div id="journey"></div></section>
<div id="controls" class="board" hidden></div>
<section id="play-ui" hidden><header class="play-header"><button id="back" class="glass square" aria-label="配達を選ぶ / Choose delivery">‹</button><div class="stage-heading"><p id="stage-id"></p><h2 id="stage-name"></h2></div><div id="delivery-count" aria-label="配達状況 / Deliveries"></div><button id="settings-button" class="glass square" aria-label="設定 / Settings">☷</button></header>
<p id="lesson" class="lesson"></p><div class="play-bottom"><div class="status-line"><span id="status" role="status"></span><span id="tick"></span></div><div class="toolbar"><button id="reset" class="glass" data-ja="↶ やり直す" data-en="↶ Reset"></button><button id="edit-route" class="glass" data-ja="↶ 道を直す" data-en="↶ Edit route" hidden></button><button id="step" class="glass" data-ja="1拍進む" data-en="One beat" hidden></button><button id="go" class="primary"></button><button id="hint" class="glass hint" data-ja="ヒント" data-en="Hint"></button></div><p id="hint-copy"></p></div>
<section id="result" class="result" hidden><p id="result-kicker" class="eyebrow"></p><h2 id="result-title"></h2><p id="result-copy"></p><div><button id="retry" class="glass" data-ja="↶ 道を直す" data-en="↶ Edit route"></button><button id="next" class="primary"></button></div><button id="result-levels" class="quiet" data-ja="配達を選ぶ" data-en="Choose a delivery"></button></section><p id="accessible-state" class="sr-only" aria-live="polite"></p></section>
<p id="save-warning" role="alert" hidden></p><footer class="game-footer"><span>✦ Small steps. Lovely deliveries.</span><a href="/" data-ja="Reviewへ" data-en="Back to review"></a></footer></main>
<dialog id="settings"><div class="dialog-heading"><h2 data-ja="心地よく遊ぶ" data-en="Make yourself at home"></h2><button id="close-settings" class="quiet square" aria-label="閉じる / Close">×</button></div><label class="setting"><span data-ja="すべての音をミュート" data-en="Mute all sound"></span><input id="mute" type="checkbox"></label><label class="setting"><span data-ja="効果音" data-en="Sound effects"></span><input id="sfx-gain" type="range" min="0" max="1" step=".05"></label><label class="setting"><span data-ja="音楽" data-en="Music"></span><input id="music-enabled" type="checkbox"></label><label class="setting"><span data-ja="音楽の音量" data-en="Music volume"></span><input id="music-gain" type="range" min="0" max=".5" step=".01"></label><label class="setting"><span data-ja="動きを控えめに" data-en="Reduce motion"></span><input id="reduce" type="checkbox"></label><p class="settings-note" data-ja="設定を閉じたあと、出発・続けるで再開します。" data-en="After closing, press Go or Resume when you’re ready."></p></dialog>
<dialog id="confirm-reset"><h2 data-ja="最初の道に戻しますか？" data-en="Restore the original route?"></h2><p data-ja="この面の矢印と待機を戻します。クリア記録は残ります。" data-en="This resets the arrows and waits. Your completed deliveries stay saved."></p><div class="dialog-actions"><button id="cancel-reset" class="glass" data-ja="戻る" data-en="Cancel"></button><button id="confirm-initial" class="primary" data-ja="最初に戻す" data-en="Restore"></button></div></dialog>
</body></html>

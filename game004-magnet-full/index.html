<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#152327"><title>MAGNET · Full Game · Local Review</title></head><body>
<main id="game" aria-label="Project Magnet action arena"><canvas id="arena" aria-label="Move with WASD. Hold the mouse to gather metal, aim, then release to launch." tabindex="0"></canvas>

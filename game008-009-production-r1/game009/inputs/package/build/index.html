<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201a17"><title>火種と釉 | Tinlumo</title><meta name="description" content="火を足す、余熱を読む。三つの器を焼き上げる、6〜8分の手仕事ゲーム。"><link rel="stylesheet" href="./src/style.css"></head>
<body><a class="skip" href="#board">ゲームへ / Skip to game</a><main id="app">
<header><a class="brand" href="#board">TINLUMO <span>009</span></a><span class="brand-sub">EMBER &amp; GLAZE</span><div class="header-actions"><button id="language" type="button">EN</button><button id="settings-open" type="button" aria-label="設定">⚙</button></div></header>
<section class="game-layout"><div class="stage-wrap"><div class="stage-top"><span id="chapter">THREE VESSELS</span><button id="pause" disabled type="button">一時停止</button></div><div id="stage"><canvas id="board" width="720" height="720" tabindex="0" role="application" aria-label="ゲーム画面"></canvas><div id="overlay"><p id="eyebrow">EMBER &amp; GLAZE</p><h1 id="title">Game009</h1><p id="tagline"></p><div id="overlay-detail"></div><button id="start" class="primary" type="button">はじめる</button><button id="secondary" type="button" hidden></button></div></div><div class="hud" aria-live="off"><span id="hud-label"></span><strong id="hud-value">—</strong><span id="hud-detail"></span></div><div class="progress-track"><div id="progress-fill"></div></div></div><aside><p class="smallcaps" id="role">A NEW REASON TO PLAY</p><h2 id="side-title">Game009</h2><p id="side-hook"></p><div class="rule-block"><span id="control-label">操作</span><p id="controls"></p></div><div class="rule-block"><span id="goal-label">目標</span><p id="goal"></p></div><p class="hint" id="hint"></p><div id="save-status" role="status"></div></aside></section>

<dialog id="reset-dialog"><h2 id="reset-title">保存データを消去しますか？</h2><p id="reset-description">このゲームの記録と設定を消去します。先に書き出して保管できます。</p><div class="dialog-head"><button id="reset-cancel" type="button">戻る</button><button id="reset-confirm" type="button">消去する</button></div></dialog>

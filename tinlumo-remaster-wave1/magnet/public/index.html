<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#152327"><title>PROJECT MAGNET · Bright Industrial Frontier</title><link rel="stylesheet" href="./game.css"></head><body>
<main id="game" aria-label="Project Magnet action arena"><canvas id="arena" aria-label="Move with WASD. Hold the mouse to gather metal, aim, then release to launch." tabindex="0"></canvas>
<header><a class="wordmark" href="/index.html" aria-label="Open review pack"><span class="brand">TINLUMO / 004</span><strong>PROJECT <b>MAGNET</b></strong></a><nav aria-label="Game controls"><button id="missions">MISSIONS</button><button id="language">EN</button><button id="sound" aria-label="Mute sound" title="Sound">SOUND ON</button><button id="motion" aria-label="Reduce motion" title="Reduce motion">MOTION</button><button id="pause" aria-label="Pause">Ⅱ</button><button id="restart" aria-label="Restart" title="Restart (R)">↻</button></nav></header>

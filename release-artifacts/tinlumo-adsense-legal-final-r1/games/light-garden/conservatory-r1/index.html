<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17483d"><title>ひかりの仕掛け庭 | Tinlumo</title><link rel="stylesheet" href="/games/light-garden/conservatory-r1/game.css"><meta name="robots" content="noindex,nofollow"><meta name="description" content="鏡で光をつなぎ、花を咲かせよう。"><style>body{min-width:0}@media(max-width:680px){.title-copy h1 br{display:block}.title-copy h1 em{margin-left:0}}</style></head>

<main id="main"><section id="title-screen" class="title-copy"><p class="eyebrow" id="title-kicker">ひかりを育てる、小さな温室</p><h1>Lightwork<br><em>Garden</em></h1><p class="title-ja" id="title-jp">ひかりの仕掛け庭</p><p class="title-description" id="title-description">鏡をひとつ回す。光がめぐり、花がひらく。心をほどく、18の小さなパズル。</p><div class="title-actions"><button id="continue" class="primary" type="button">はじめる →</button><button id="title-levels" class="secondary" type="button">温室を選ぶ</button></div><p class="title-note" id="title-note">ゆっくり、ひとすじずつ。 • ダウンロード不要</p></section>
